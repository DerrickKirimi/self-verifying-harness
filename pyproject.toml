[project]
name = "self-verifying-harness"
version = "0.1.0"
description = "Fail-before/pass-after evidence for recording-grounded software claims"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "pytest>=9.0.3,<10"]

[project.scripts]
svh = "svh.cli:main"

[project.optional-dependencies]
agent = [
    "deepagents==0.7.28",
    "langchain-google-genai==4.4.2",
    "mcp==2.3.0",
]
datasets = [
    "pyarrow>=26.0.0",
]
retrieval = [
    "sentence-transformers==6.1.0",
    "transformers==5.20.2",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "pillow>=10.0.1,<16",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
