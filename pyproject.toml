[project]
name = "self-verifying-harness"
version = "0.1.0"
description = "Fail-before/pass-after evidence for recording-grounded software claims"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "pytest>=9.0.3,<10"]

[project.scripts]
svh = "svh.cli:main"

[project.optional-dependencies]
agent = [
    "deepagents==0.7.28",
    "langchain-google-genai==4.4.2",
    "mcp==2.3.0",
]
datasets = [
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
